<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#07080a"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#glow)"/>
  
  <!-- Play button circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00ff88" stroke-width="8" opacity="0.3"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00ff88" stroke-width="4"/>
  
  <!-- Play triangle -->
  <path d="M220 180 L340 256 L220 332 Z" fill="#00ff88"/>
  
  <!-- Music notes decoration -->
  <g fill="#00ff88" opacity="0.6">
    <circle cx="380" cy="140" r="12"/>
    <rect x="377" y="100" width="6" height="40"/>
    <circle cx="420" cy="130" r="10"/>
    <rect x="417" y="95" width="5" height="35"/>
    <path d="M383 100 Q400 85 422 95" stroke="#00ff88" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Sound waves -->
  <g stroke="#00ff88" stroke-width="4" fill="none" opacity="0.4">
    <path d="M360 230 Q380 256 360 282"/>
    <path d="M385 210 Q415 256 385 302"/>
  </g>
</svg>
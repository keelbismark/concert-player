<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#07080a">
    <title>Concert Remote</title>
    <link rel="stylesheet" href="css/remote.css">
</head>
<body>
    <!-- Player Selector -->
    <div class="player-selector" id="player-selector">
        <h2>🎵 Выберите плеер</h2>
        <div class="player-list" id="player-list">
            <div class="no-players">Поиск плееров...</div>
        </div>
        <button class="refresh-btn" id="refresh-players">🔄 Обновить</button>
    </div>

    <!-- Connection Status -->
    <div class="connection-status disconnected" id="connection-status">
        Подключение...
    </div>

    <!-- Remote Container -->
    <div class="remote-container">
        <!-- Now Playing -->
        <div class="now-playing-card">
            <!-- Status Badge -->
            <div class="playback-status" id="playback-status">
                <span class="status-icon" id="status-icon">○</span>
                <span class="status-text" id="status-text">Готов</span>
            </div>
            
            <div class="remote-track-title" id="remote-track-title">—</div>
            <div class="remote-track-note" id="remote-track-note"></div>
            
            <div class="remote-timer" id="remote-timer">--:--</div>
            
            <!-- Position indicator for stopped/paused state -->
            <div class="position-indicator" id="position-indicator"></div>
            
            <div class="remote-progress">
                <div class="remote-progress-bar" id="remote-progress"></div>
            </div>
            <div class="remote-time">
                <span id="remote-time-current">0:00</span>
                <span id="remote-time-total">0:00</span>
            </div>
            
            <div class="seek-controls">
                <button class="seek-btn" id="seek-back-30">-30s</button>
                <button class="seek-btn" id="seek-back-10">-10s</button>
                <button class="seek-btn" id="seek-forward-10">+10s</button>
                <button class="seek-btn" id="seek-forward-30">+30s</button>
            </div>
        </div>

        <!-- Controls - УПРОЩЁННЫЕ -->
        <div class="remote-controls">
            <button class="remote-btn remote-btn-secondary" id="remote-prev" title="Предыдущий">⏮</button>
            <button class="remote-btn remote-btn-stop" id="remote-stop" title="Стоп">⏹</button>
            <button class="remote-btn remote-btn-primary" id="remote-play" title="Play/Pause">▶</button>
            <button class="remote-btn remote-btn-secondary" id="remote-next" title="Следующий">⏭</button>
        </div>

        <!-- Next Up -->
        <div class="next-up-card" id="next-up-card">
            <div>
                <div class="next-up-label">Следующий</div>
                <div class="next-up-title" id="next-up-title">—</div>
            </div>
            <div class="next-up-duration" id="next-up-duration">--:--</div>
        </div>

        <!-- Playlist -->
        <div class="remote-playlist">
            <div class="remote-playlist-header">
                <span class="remote-playlist-title">Плейлист</span>
                <span class="remote-playlist-count" id="playlist-count">0 треков</span>
            </div>
            <div id="remote-playlist-items"></div>
        </div>

        <!-- Volume -->
        <div class="volume-card">
            <span class="volume-icon" id="remote-volume-icon">🔊</span>
            <div class="volume-slider-container">
                <input type="range" class="volume-slider" id="remote-volume" min="0" max="100" value="100">
            </div>
            <span class="volume-value" id="remote-volume-value">100%</span>
        </div>
        
        <div class="connection-info" id="connection-info"></div>
    </div>

    <script>
    class RemoteClient {
        constructor() {
            this.ws = null;
            this.isConnected = false;
            this.selectedPlayerId = null;
            this.selectedPlayerName = null;
            this.players = [];
            this.reconnectAttempts = 0;
            this.maxReconnectDelay = 30000;
            this.baseReconnectDelay = 1000;
            this.heartbeatInterval = null;
            this.lastPong = Date.now();
            this.lastState = null;

            this.targetPlayerId = this.getPlayerIdFromUrl();
            
            console.log('🎮 Remote initialized');

            this.cacheElements();
            this.bindEvents();
            this.connect();
        }

        getPlayerIdFromUrl() {
            // 1. Проверяем путь /remote/player-xxx
            const pathMatch = window.location.pathname.match(/\/remote\/(.+)/);
            if (pathMatch && pathMatch[1]) {
                return decodeURIComponent(pathMatch[1]);
            }
            
            // 2. Проверяем query параметр ?player=xxx
            const params = new URLSearchParams(window.location.search);
            const playerId = params.get('player');
            if (playerId) {
                return decodeURIComponent(playerId);
            }
            
            return null;
        }

        cacheElements() {
            this.elements = {
                playerSelector: document.getElementById('player-selector'),
                playerList: document.getElementById('player-list'),
                refreshPlayers: document.getElementById('refresh-players'),
                status: document.getElementById('connection-status'),
                connectionInfo: document.getElementById('connection-info'),
                trackTitle: document.getElementById('remote-track-title'),
                trackNote: document.getElementById('remote-track-note'),
                timer: document.getElementById('remote-timer'),
                progress: document.getElementById('remote-progress'),
                timeCurrent: document.getElementById('remote-time-current'),
                timeTotal: document.getElementById('remote-time-total'),
                playBtn: document.getElementById('remote-play'),
                stopBtn: document.getElementById('remote-stop'),
                prevBtn: document.getElementById('remote-prev'),
                nextBtn: document.getElementById('remote-next'),
                seekBack30: document.getElementById('seek-back-30'),
                seekBack10: document.getElementById('seek-back-10'),
                seekForward10: document.getElementById('seek-forward-10'),
                seekForward30: document.getElementById('seek-forward-30'),
                nextUpTitle: document.getElementById('next-up-title'),
                nextUpDuration: document.getElementById('next-up-duration'),
                nextUpCard: document.getElementById('next-up-card'),
                playlistItems: document.getElementById('remote-playlist-items'),
                playlistCount: document.getElementById('playlist-count'),
                volumeSlider: document.getElementById('remote-volume'),
                volumeValue: document.getElementById('remote-volume-value'),
                volumeIcon: document.getElementById('remote-volume-icon'),
                playbackStatus: document.getElementById('playback-status'),
                statusIcon: document.getElementById('status-icon'),
                statusText: document.getElementById('status-text'),
                positionIndicator: document.getElementById('position-indicator'),
                nowPlayingCard: document.querySelector('.now-playing-card')
            };
        }

        connect() {
            this.updateStatus('connecting');
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;
            
            try {
                this.ws = new WebSocket(wsUrl);
            } catch (err) {
                console.error('WebSocket error:', err);
                this.scheduleReconnect();
                return;
            }

            this.ws.onopen = () => {
                console.log('✅ WebSocket connected');
                this.isConnected = true;
                this.reconnectAttempts = 0;
                
                this.ws.send(JSON.stringify({ 
                    type: 'identify', 
                    clientType: 'remote'
                }));
                
                this.updateStatus('connected');
                this.startHeartbeat();
            };

            this.ws.onmessage = (event) => {
                try {
                    this.handleMessage(JSON.parse(event.data));
                } catch (e) {
                    console.error('Parse error:', e);
                }
            };

            this.ws.onclose = (event) => {
                this.isConnected = false;
                this.stopHeartbeat();
                this.updateStatus('disconnected');
                this.scheduleReconnect();
            };

            this.ws.onerror = () => console.error('WebSocket error');
        }

        scheduleReconnect() {
            const delay = Math.min(
                this.maxReconnectDelay, 
                this.baseReconnectDelay * Math.pow(2, this.reconnectAttempts)
            );
            this.reconnectAttempts++;
            this.elements.connectionInfo.textContent = `Переподключение через ${Math.round(delay/1000)}с...`;
            setTimeout(() => this.connect(), delay);
        }

        startHeartbeat() {
            this.stopHeartbeat();
            this.lastPong = Date.now();
            this.heartbeatInterval = setInterval(() => {
                if (this.ws?.readyState === WebSocket.OPEN) {
                    if (Date.now() - this.lastPong > 35000) {
                        this.ws.close();
                        return;
                    }
                    this.send('ping');
                }
            }, 25000);
        }

        stopHeartbeat() {
            if (this.heartbeatInterval) {
                clearInterval(this.heartbeatInterval);
                this.heartbeatInterval = null;
            }
        }

        handleMessage(data) {
            if (!data?.type) return;

            switch (data.type) {
                case 'pong':
                    this.lastPong = Date.now();
                    break;
                case 'player-list':
                    this.handlePlayerList(data.players);
                    break;
                case 'player-selected':
                    this.selectedPlayerId = data.playerId;
                    this.selectedPlayerName = data.playerName;
                    this.hidePlayerSelector();
                    this.elements.connectionInfo.textContent = `🎵 ${data.playerName}`;
                    break;
                case 'player-disconnected':
                    this.selectedPlayerId = null;
                    this.showPlayerSelector();
                    this.updateStatus('disconnected');
                    setTimeout(() => this.send('get-players'), 1000);
                    break;
                case 'error':
                    this.elements.connectionInfo.textContent = '⚠️ ' + data.message;
                    break;
                case 'state':
                    this.updateUI(data);
                    break;
            }
        }

        handlePlayerList(players) {
            this.players = players;
            
            if (!players.length) {
                this.elements.playerList.innerHTML = `
                    <div class="no-players">
                        <p>😴 Нет доступных плееров</p>
                        <p style="font-size: 0.85rem; margin-top: 8px; opacity: 0.7;">
                            Откройте Concert Player на компьютере
                        </p>
                    </div>
                `;
                this.showPlayerSelector();
                return;
            }
            
            if (this.targetPlayerId && !this.selectedPlayerId) {
                const targetPlayer = players.find(p => p.id === this.targetPlayerId);
                if (targetPlayer) {
                    this.selectPlayer(targetPlayer.id);
                    return;
                }
            }
            
            if (players.length === 1 && !this.selectedPlayerId) {
                this.selectPlayer(players[0].id);
                return;
            }
            
            if (this.selectedPlayerId && players.find(p => p.id === this.selectedPlayerId)) {
                this.hidePlayerSelector();
                return;
            }
            
            this.elements.playerList.innerHTML = players.map(p => `
                <div class="player-item" data-player-id="${p.id}">
                    <div class="player-name">🎵 ${p.name}</div>
                    <div class="player-status">${p.hasState ? '● Активен' : '○ Готов'}</div>
                </div>
            `).join('');
            
            this.elements.playerList.querySelectorAll('.player-item').forEach(item => {
                item.onclick = () => {
                    this.selectPlayer(item.dataset.playerId);
                    this.vibrate();
                };
            });
            
            this.showPlayerSelector();
        }

        selectPlayer(id) {
            this.send('select-player', { playerId: id });
        }

        showPlayerSelector() {
            this.elements.playerSelector.classList.remove('hidden');
        }

        hidePlayerSelector() {
            this.elements.playerSelector.classList.add('hidden');
        }

        updateStatus(status) {
            const el = this.elements.status;
            el.className = 'connection-status ' + status;
            el.textContent = status === 'connected' ? '✓ Подключено' : 
                            status === 'disconnected' ? '✕ Отключено' : '⟳ Подключение...';
        }

        getPlaybackState(isPlaying, isPaused, currentTime, duration) {
            if (isPlaying && !isPaused) return 'playing';
            if (isPaused) return 'paused';
            if (duration > 0 && currentTime >= duration - 0.5) return 'finished';
            if (currentTime > 0.5 && duration > 0) return 'stopped';
            return 'ready';
        }

        updatePlaybackStatus(state, currentTime) {
            const { statusIcon, statusText, playbackStatus, positionIndicator, nowPlayingCard, timer } = this.elements;
            
            playbackStatus.className = 'playback-status';
            nowPlayingCard.classList.remove('state-playing', 'state-paused', 'state-stopped', 'state-finished', 'state-ready');
            timer.classList.remove('playing', 'paused', 'stopped', 'finished');
            
            const states = {
                playing: { icon: '▶', text: 'Воспроизведение', position: '' },
                paused: { icon: '⏸', text: 'Пауза', position: `Позиция: ${this.formatTime(currentTime)}` },
                stopped: { icon: '⏹', text: 'Остановлено', position: `▶ Продолжить с ${this.formatTime(currentTime)}` },
                finished: { icon: '✓', text: 'Завершён', position: '' },
                ready: { icon: '○', text: 'Готов', position: '' }
            };
            
            const s = states[state] || states.ready;
            statusIcon.textContent = s.icon;
            statusText.textContent = s.text;
            playbackStatus.classList.add(`status-${state}`);
            nowPlayingCard.classList.add(`state-${state}`);
            timer.classList.add(state);
            positionIndicator.textContent = s.position;
            positionIndicator.style.display = s.position ? 'block' : 'none';
        }

        updateUI(state) {
            this.lastState = state;
            
            const { 
                currentTrack, nextTrack, duration = 0, currentTime = 0, 
                volume, playlist, playlistLength, isPlaying, isPaused 
            } = state;

            const playbackState = this.getPlaybackState(isPlaying, isPaused, currentTime, duration);
            this.updatePlaybackStatus(playbackState, currentTime);

            // Track info
            this.elements.trackTitle.textContent = currentTrack?.title || '—';
            this.elements.trackNote.textContent = currentTrack?.note || '';
            this.elements.timeTotal.textContent = this.formatTime(currentTrack?.duration);

            // Timer
            const remaining = Math.max(0, duration - currentTime);
            this.elements.timer.textContent = this.formatTime(remaining);
            this.elements.timeCurrent.textContent = this.formatTime(currentTime);
            
            // Warning classes
            this.elements.timer.classList.remove('warning', 'critical');
            if (isPlaying && !isPaused && remaining > 0) {
                if (remaining <= 5) this.elements.timer.classList.add('critical');
                else if (remaining <= 15) this.elements.timer.classList.add('warning');
            }

            // Progress
            const progress = duration > 0 ? (currentTime / duration) * 100 : 0;
            this.elements.progress.style.width = `${progress}%`;

            // Play button - теперь Play/Pause
            const { playBtn, stopBtn } = this.elements;
            
            if (isPlaying) {
                playBtn.innerHTML = '⏸';
                playBtn.classList.add('playing');
                playBtn.title = 'Пауза';
            } else {
                playBtn.innerHTML = '▶';
                playBtn.classList.remove('playing');
                playBtn.title = playbackState === 'stopped' || playbackState === 'paused' 
                    ? 'Продолжить' : 'Воспроизвести';
                
                if (playbackState === 'stopped' || playbackState === 'paused') {
                    playBtn.classList.add('can-resume');
                } else {
                    playBtn.classList.remove('can-resume');
                }
            }

            // Stop button visibility
            stopBtn.classList.toggle('hidden', !isPlaying && playbackState !== 'paused' && playbackState !== 'stopped');

            // Next track
            if (nextTrack) {
                this.elements.nextUpTitle.textContent = nextTrack.title;
                this.elements.nextUpDuration.textContent = this.formatTime(nextTrack.duration);
                this.elements.nextUpCard.style.display = '';
            } else {
                this.elements.nextUpCard.style.display = 'none';
            }

            // Volume
            if (typeof volume === 'number') {
                this.elements.volumeSlider.value = volume;
                this.elements.volumeValue.textContent = `${volume}%`;
                this.elements.volumeIcon.textContent = volume === 0 ? '🔇' : volume < 50 ? '🔉' : '🔊';
            }

            // Playlist
            if (Array.isArray(playlist)) {
                const currentIdx = currentTrack?.index;
                this.elements.playlistItems.innerHTML = playlist.map((t, i) => `
                    <div class="remote-track-item ${i === currentIdx ? 'current' : ''} ${i === currentIdx && isPlaying ? 'playing' : ''}" 
                         data-index="${t.index ?? i}">
                        <div class="remote-track-number">${i + 1}</div>
                        <div class="remote-track-info">
                            <div class="remote-track-name">${t.title || 'Unknown'}</div>
                            <div class="remote-track-duration">${this.formatTime(t.duration)}</div>
                        </div>
                    </div>
                `).join('');

                this.elements.playlistItems.querySelectorAll('.remote-track-item').forEach(item => {
                    item.onclick = () => {
                        this.send('select', { index: parseInt(item.dataset.index) });
                        this.vibrate();
                    };
                });
            }
            
            if (typeof playlistLength === 'number') {
                this.elements.playlistCount.textContent = `${playlistLength} треков`;
            }
        }

        send(type, data = {}) {
            if (this.ws?.readyState === WebSocket.OPEN) {
                this.ws.send(JSON.stringify({ type, ...data }));
            }
        }

        bindEvents() {
            const { 
                refreshPlayers, playBtn, stopBtn, nextBtn, prevBtn, 
                seekBack30, seekBack10, seekForward10, seekForward30, 
                volumeSlider 
            } = this.elements;

            refreshPlayers.onclick = () => {
                this.send('get-players');
                this.vibrate();
            };

            // Play/Pause - одна кнопка
            playBtn.onclick = () => {
                const state = this.lastState;
                if (state?.isPlaying) {
                    // Если играет - ставим на паузу
                    this.send('pause');
                } else {
                    // Если не играет - запускаем (продолжаем)
                    this.send('play');
                }
                this.vibrate();
            };

            // Stop - отдельная кнопка
            stopBtn.onclick = () => {
                this.send('stop');
                this.vibrate();
            };

            nextBtn.onclick = () => {
                this.send('next');
                this.vibrate();
            };

            prevBtn.onclick = () => {
                this.send('prev');
                this.vibrate();
            };

            seekBack30.onclick = () => {
                this.send('seek-relative', { delta: -30 });
                this.vibrate();
            };

            seekBack10.onclick = () => {
                this.send('seek-relative', { delta: -10 });
                this.vibrate();
            };

            seekForward10.onclick = () => {
                this.send('seek-relative', { delta: 10 });
                this.vibrate();
            };

            seekForward30.onclick = () => {
                this.send('seek-relative', { delta: 30 });
                this.vibrate();
            };

            let volumeThrottle = null;
            volumeSlider.oninput = (e) => {
                const v = parseInt(e.target.value);
                this.elements.volumeValue.textContent = `${v}%`;
                this.elements.volumeIcon.textContent = v === 0 ? '🔇' : v < 50 ? '🔉' : '🔊';
                
                if (!volumeThrottle) {
                    volumeThrottle = setTimeout(() => {
                        this.send('volume', { value: parseInt(volumeSlider.value) });
                        volumeThrottle = null;
                    }, 100);
                }
            };

            document.addEventListener('gesturestart', e => e.preventDefault());
            let lastTouch = 0;
            document.addEventListener('touchend', e => {
                if (Date.now() - lastTouch <= 300) e.preventDefault();
                lastTouch = Date.now();
            }, { passive: false });
        }

        vibrate(ms = 30) {
            navigator.vibrate?.(ms);
        }
        
        formatTime(s) {
            if (!s || !isFinite(s)) return '0:00';
            return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        window.remoteClient = new RemoteClient();
    });
    </script>
</body>
</html>
